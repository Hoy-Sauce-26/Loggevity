name: loggevity
description: A local-first, account-free longevity habit tracker.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local storage
  drift: ^2.20.0
  sqlcipher_flutter_libs: ^0.6.0
  sqlite3: ^2.4.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.0
  path: ^1.9.0

  # State management
  flutter_riverpod: ^3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
